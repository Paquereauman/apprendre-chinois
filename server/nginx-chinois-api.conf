server {
    listen 80;
    listen [::]:80;
    server_name chinois.45-192-198-98.sslip.io;
    root /var/www/letsencrypt;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name chinois.45-192-198-98.sslip.io;
    ssl_certificate /etc/letsencrypt/live/chinois.45-192-198-98.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinois.45-192-198-98.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/chinois;
    client_max_body_size 400k;
    set $cors "";
    if ($http_origin = "https://paquereauman.github.io") { set $cors $http_origin; }
    location = /api.php {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors always;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
    location / { return 404; }
}
